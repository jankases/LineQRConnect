<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CRM System</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- โหลด Supabase SDK และ Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./assets/js/config.js"></script>

  <style>
    body { background-color: #f1f5f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
    .login-wrapper { width: 100%; max-width: 400px; padding: 15px; }
    .login-card { background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); padding: 40px 30px; border: 1px solid #e2e8f0; }
    .login-brand-icon { width: 60px; height: 60px; background: #3b82f6; color: white; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px auto; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }
    .login-title { font-weight: 800; color: #1e293b; font-size: 24px; }
    .login-subtitle { color: #64748b; font-size: 14px; margin-bottom: 30px; }
    .login-label { font-weight: 600; color: #475569; font-size: 13px; margin-bottom: 6px; display: block; text-align: left; }
    .login-input-group .input-group-text { background: transparent; border-right: none; color: #94a3b8; border-color: #cbd5e1; border-radius: 10px 0 0 10px; }
    .login-input { border-left: none; border-color: #cbd5e1; font-weight: 500; color: #334155; border-radius: 0 10px 10px 0 !important; }
    .login-input:focus { border-color: #cbd5e1; box-shadow: none; background-color: #f8fafc; }
    .login-input-group:focus-within .input-group-text, .login-input-group:focus-within .login-input { border-color: #3b82f6; }
    .btn-login-submit { background: #3b82f6; border: none; border-radius: 10px; padding: 12px; font-weight: bold; font-size: 15px; transition: 0.2s; }
    .btn-login-submit:hover { background: #2563eb; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); }
  </style>
</head>
<body>

<div class="login-wrapper">
  <div class="login-card text-center">
    
    <div class="login-brand-icon" id="brandIcon">
      <i class="fa-solid fa-user-lock fs-2"></i>
    </div>

    <h3 class="login-title mb-1" id="mainTitle">CRM System</h3>
    <p class="login-subtitle" id="subTitle">Please log in with your company email</p>

    <!-- 1. FORM: LOG IN -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="mb-3">
        <label class="login-label">Email</label>
        <div class="input-group login-input-group">
          <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
          <input type="email" class="form-control login-input" id="loginEmail" placeholder="name@roche.com" required>
        </div>
      </div>
      <div class="mb-4">
        <label class="login-label">Password</label>
        <div class="input-group login-input-group">
          <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
          <input type="password" class="form-control login-input" id="loginPassword" placeholder="••••••••" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 btn-login-submit mb-4" id="btnLoginBtn">Log In</button>
      <div class="pt-2 border-top text-center">
        <a href="#" class="text-decoration-none text-secondary small fw-bold" onclick="toggleView('forgot'); return false;">
          <i class="fa-solid fa-file-signature me-1"></i> Forgot Password?
        </a>
      </div>
    </form>

    <!-- 2. FORM: FORGOT PASSWORD (ส่งลิงก์เข้าอีเมล) -->
    <form id="forgotForm" class="d-none" onsubmit="handleForgotPassword(event)">
      <div class="mb-4">
        <label class="login-label">Enter your Email</label>
        <div class="input-group login-input-group">
          <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
          <input type="email" class="form-control login-input" id="forgotEmail" placeholder="name@roche.com" required>
        </div>
        <div class="form-text mt-2 text-start" style="font-size: 12px; color: #64748b;">
          เราจะส่งลิงก์รีเซ็ตรหัสผ่านไปที่อีเมลของคุณ
        </div>
      </div>
      <button type="submit" class="btn btn-warning w-100 btn-login-submit mb-3 fw-bold text-dark" id="btnForgotBtn">Send Reset Link</button>
      <div class="pt-2 border-top">
        <a href="#" class="text-decoration-none text-primary small fw-bold" onclick="toggleView('login'); return false;">
          <i class="fa-solid fa-arrow-left me-1"></i> Back to Log In
        </a>
      </div>
    </form>

    <!-- 3. FORM: RESET PASSWORD (โชว์ตอนกดลิงก์จากอีเมลกลับมา) -->
    <form id="resetForm" class="d-none" onsubmit="handleResetPassword(event)">
      <div class="mb-4">
        <label class="login-label">New Password</label>
        <div class="input-group login-input-group mb-2">
          <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
          <input type="password" class="form-control login-input" id="newPassword" placeholder="รหัสผ่านใหม่" minlength="6" required>
        </div>
        <div class="form-text text-start" style="font-size: 12px; color: #64748b;">
          รหัสผ่านต้องมีความยาวอย่างน้อย 6 ตัวอักษร
        </div>
      </div>
      <button type="submit" class="btn btn-success w-100 btn-login-submit mb-3 fw-bold" id="btnResetBtn">Save New Password</button>
    </form>

  </div>
</div>

<script>
  const sb = window.supabaseClient;

  // ตรวจสอบว่ามีลิงก์ Recovery มาจากอีเมลหรือไม่ตอนโหลดหน้า
  window.onload = () => {
    if (window.location.hash.includes("type=recovery")) {
      toggleView('reset');
    } else {
      sb.auth.getSession().then(({ data }) => {
        if (data.session) window.location.href = 'index.html'; // ถ้ามีล็อกอินค้างอยู่ เด้งไปหน้าหลักเลย
      });
    }
  };

  function toggleView(view) {
    document.getElementById('loginForm').classList.add('d-none');
    document.getElementById('forgotForm').classList.add('d-none');
    document.getElementById('resetForm').classList.add('d-none');

    const title = document.getElementById('mainTitle');
    const subtitle = document.getElementById('subTitle');
    const icon = document.getElementById('brandIcon');

    if (view === 'login') {
      document.getElementById('loginForm').classList.remove('d-none');
      title.innerText = "CRM System"; subtitle.innerText = "Please log in with your company email";
      icon.innerHTML = '<i class="fa-solid fa-user-lock fs-2"></i>'; icon.style.background = "#3b82f6";
    } else if (view === 'forgot') {
      document.getElementById('forgotForm').classList.remove('d-none');
      title.innerText = "Forgot Password"; subtitle.innerText = "Request a password reset link";
      icon.innerHTML = '<i class="fa-solid fa-envelope-open-text fs-2"></i>'; icon.style.background = "#f59e0b";
    } else if (view === 'reset') {
      document.getElementById('resetForm').classList.remove('d-none');
      title.innerText = "Reset Password"; subtitle.innerText = "Create your new secure password";
      icon.innerHTML = '<i class="fa-solid fa-shield-halved fs-2"></i>'; icon.style.background = "#10b981";
    }
  }

  // 1. เข้าสู่ระบบ
  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('btnLoginBtn');
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value.trim();

    btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Logging in...';

    const { data, error } = await sb.auth.signInWithPassword({ email, password });

    if (error) {
      alert("❌ รหัสผ่านไม่ถูกต้อง หรืออีเมลไม่เข้าระบบ");
      btn.disabled = false; btn.innerHTML = 'Log In';
    } else {
      window.location.href = 'index.html';
    }
  }

  // 2. ขอลิงก์รีเซ็ตรหัสผ่าน
  async function handleForgotPassword(e) {
    e.preventDefault();
    const btn = document.getElementById('btnForgotBtn');
    const email = document.getElementById('forgotEmail').value.trim();

    btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Sending...';

    // ส่งอีเมลโดยระบุให้เด้งกลับมาหน้านี้หลังจากคลิก
    const { data, error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + window.location.pathname
    });

    if (error) {
      alert("❌ เกิดข้อผิดพลาด: " + error.message);
    } else {
      alert("✅ ส่งลิงก์รีเซ็ตรหัสผ่านไปที่อีเมลของคุณแล้ว! กรุณาเช็กกล่องจดหมาย");
      toggleView('login');
    }
    btn.disabled = false; btn.innerHTML = 'Send Reset Link';
  }

  // 3. บันทึกรหัสผ่านใหม่ (หลังจากกดลิงก์มาแล้วกรอกรหัสใหม่)
  async function handleResetPassword(e) {
    e.preventDefault();
    const btn = document.getElementById('btnResetBtn');
    const newPassword = document.getElementById('newPassword').value.trim();

    btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Saving...';

    const { data, error } = await sb.auth.updateUser({ password: newPassword });

    if (error) {
      alert("❌ ไม่สามารถเปลี่ยนรหัสผ่านได้: " + error.message);
      btn.disabled = false; btn.innerHTML = 'Save New Password';
    } else {
      alert("✅ เปลี่ยนรหัสผ่านเรียบร้อย! คุณกำลังเข้าสู่ระบบ");
      window.location.href = 'index.html';
    }
  }
</script>
</body>
</html>
