<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - LINE QR Connect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #f1f6fa;
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      border: 1px solid #e2e8f0;
      width: 100%;
      max-width: 420px;
      padding: 40px 30px;
    }
    .brand-logo {
      color: #0066cc;
      font-size: 2.5rem;
      text-align: center;
      margin-bottom: 20px;
    }
    .form-control {
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 15px;
      border: 1px solid #cbd5e1;
      background-color: #f8fafc;
    }
    .form-control:focus {
      border-color: #0066cc;
      box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.12);
      background-color: #ffffff;
    }
    .btn-login {
      background-color: #0066cc;
      color: white;
      border-radius: 10px;
      padding: 12px;
      font-weight: bold;
      font-size: 16px;
      transition: all 0.3s ease;
    }
    .btn-login:hover {
      background-color: #0052a3;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 102, 204, 0.2);
    }
    .alert-error {
      display: none;
      font-size: 14px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="brand-logo">
      <i class="fa-brands fa-line text-success"></i> <i class="fa-solid fa-qrcode"></i>
    </div>
    <h3 class="text-center fw-bold mb-1" style="color: #334155;">เข้าสู่ระบบ</h3>
    <p class="text-center text-secondary mb-4" style="font-size: 14.5px;">LINE QR Connect Portal</p>

    <div id="errorMessage" class="alert alert-danger alert-error py-2 px-3 fw-medium">
      <i class="fa-solid fa-triangle-exclamation me-1"></i> <span id="errorText">อีเมลหรือรหัสผ่านไม่ถูกต้อง</span>
    </div>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label text-secondary fw-bold small">อีเมล (Email)</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-envelope text-muted"></i></span>
          <input type="email" id="inputEmail" class="form-control border-start-0 ps-0" placeholder="admin@example.com" required>
        </div>
      </div>
      
      <div class="mb-4">
        <label class="form-label text-secondary fw-bold small">รหัสผ่าน (Password)</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
          <input type="password" id="inputPassword" class="form-control border-start-0 ps-0" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" id="btnLogin" class="btn btn-login w-100">
        เข้าสู่ระบบ <i class="fa-solid fa-arrow-right-to-bracket ms-1"></i>
      </button>
    </form>
  </div>

  <!-- โหลด Supabase SDK และ Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./assets/js/config.js"></script> 
  
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const email = document.getElementById('inputEmail').value;
      const password = document.getElementById('inputPassword').value;
      const btn = document.getElementById('btnLogin');
      const errorBox = document.getElementById('errorMessage');
      const errorText = document.getElementById('errorText');

      // เปลี่ยนสถานะปุ่มตอนกำลังโหลด
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังตรวจสอบ...';
      btn.disabled = true;
      errorBox.style.display = 'none';

      // เรียกใช้งาน Supabase Auth เพื่อ Login
      const { data, error } = await window.supabaseClient.auth.signInWithPassword({
        email: email,
        password: password,
      });

      if (error) {
        // กรณี Login ไม่สำเร็จ
        errorText.innerText = "อีเมลหรือรหัสผ่านไม่ถูกต้อง กรุณาลองใหม่";
        errorBox.style.display = 'block';
        btn.innerHTML = 'เข้าสู่ระบบ <i class="fa-solid fa-arrow-right-to-bracket ms-1"></i>';
        btn.disabled = false;
      } else {
        // กรณี Login สำเร็จ ให้ Redirect ไปหน้าหลัก (Index.html)
        btn.innerHTML = '<i class="fa-solid fa-check"></i> เข้าสู่ระบบสำเร็จ!';
        btn.classList.replace('btn-login', 'btn-success');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 800);
      }
    });

    // เช็คว่าถ้า Login อยู่แล้ว ไม่ต้องให้เข้าหน้า Login อีก ให้เด้งไปหน้าแรกเลย
    window.onload = async () => {
      const { data } = await window.supabaseClient.auth.getSession();
      if (data.session) {
        window.location.href = 'Index.html';
      }
    };
  </script>
</body>
</html>
