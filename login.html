<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - LINE QR Connect</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./assets/js/config.js"></script>

  <style>
    body { background-color: #f1f5f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
    .login-wrapper { width: 100%; max-width: 400px; padding: 15px; }
    .login-card { background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); padding: 40px 30px; border: 1px solid #e2e8f0; }
    
    /* 🌟 โลโก้เป็นสีเขียว LINE */
    .login-brand-icon { width: 60px; height: 60px; background: #06C755; color: white; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px auto; box-shadow: 0 4px 12px rgba(6, 199, 85, 0.3); transition: background 0.3s; }
    
    .login-title { font-weight: 800; color: #1e293b; font-size: 24px; }
    .login-subtitle { color: #64748b; font-size: 14px; margin-bottom: 30px; }
    .login-label { font-weight: 600; color: #475569; font-size: 13px; margin-bottom: 6px; display: block; text-align: left; }
    .login-input-group .input-group-text { background: transparent; border-right: none; color: #94a3b8; border-color: #cbd5e1; border-radius: 10px 0 0 10px; }
    .login-input { border-left: none; border-color: #cbd5e1; font-weight: 500; color: #334155; border-radius: 0 10px 10px 0 !important; }
    .login-input:focus { border-color: #cbd5e1; box-shadow: none; background-color: #f8fafc; }
    
    /* 🌟 Focus สีขอบช่องกรอกเป็นสีฟ้า CRM */
    .login-input-group:focus-within .input-group-text, .login-input-group:focus-within .login-input { border-color: #0066cc; }
    
    /* 🌟 เปลี่ยนปุ่มหลักเป็นสีฟ้า CRM */
    .btn-login-submit { background: #0066cc; color: white; border: none; border-radius: 10px; padding: 12px; font-weight: bold; font-size: 15px; transition: 0.2s; }
    .btn-login-submit:hover { background: #0052a3; color: white; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0, 102, 204, 0.2); }
  </style>
</head>
<body>

<div class="login-wrapper">
  <div class="login-card text-center">
    
    <div class="login-brand-icon" id="brandIcon">
      <i class="fa-brands fa-line fs-1"></i>
    </div>

    <h3 class="login-title mb-1" id="mainTitle">LINE QR Connect</h3>
    <p class="login-subtitle" id="subTitle">Please log in with your company email</p>

    <!-- 1. FORM: LOG IN -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="mb-3">
        <label class="login-label">Email</label>
        <div class="input-group login-input-group">
          <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
          <input type="email" class="form-control login-input" id="loginEmail" placeholder="name@roche.com" required>
        </div>
      </div>
      <div class="mb-4">
        <label class="login-label">Password</label>
        <div class="input-group login-input-group">
          <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
          <input type="password" class="form-control login-input" id="loginPassword" placeholder="••••••••" required>
        </div>
      </div>
      <button type="submit" class="btn btn-login-submit w-100 mb-4" id="btnLoginBtn">Log In</button>
      <div class="pt-2 border-top text-center">
        <a href="#" class="text-decoration-none small fw-bold" style="color: #0066cc;" onclick="toggleView('forgot'); return false;">
          <i class="fa-solid fa-file-signature me-1"></i> Forgot Password?
        </a>
      </div>
    </form>

    <!-- 2. FORM: FORGOT PASSWORD -->
    <form id="forgotForm" class="d-none" onsubmit="handleForgotPassword(event)">
      <div class="mb-4">
        <label class="login-label">Enter your Email</label>
        <div class="input-group login-input-group">
          <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
          <input type="email" class="form-control login-input" id="forgotEmail" placeholder="name@roche.com" required>
        </div>
        <div class="form-text mt-2 text-start" style="font-size: 12px; color: #64748b;">
          We will send a password reset link to your email.
        </div>
      </div>
      <button type="submit" class="btn btn-warning w-100 mb-3 fw-bold text-dark border-0 rounded-3 py-2" id="btnForgotBtn">Send Reset Link</button>
      <div class="pt-2 border-top">
        <a href="#" class="text-decoration-none small fw-bold" style="color: #0066cc;" onclick="toggleView('login'); return false;">
          <i class="fa-solid fa-arrow-left me-1"></i> Back to Log In
        </a>
      </div>
    </form>

    <!-- 3. FORM: RESET PASSWORD -->
    <form id="resetForm" class="d-none" onsubmit="handleResetPassword(event)">
      <div class="mb-4">
        <label class="login-label">New Password</label>
        <div class="input-group login-input-group mb-2">
          <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
          <input type="password" class="form-control login-input" id="newPassword" placeholder="New Password" minlength="6" required>
        </div>
        <div class="form-text text-start" style="font-size: 12px; color: #64748b;">
          Password must be at least 6 characters long.
        </div>
      </div>
      <button type="submit" class="btn btn-login-submit w-100 mb-3" id="btnResetBtn">Save New Password</button>
    </form>

  </div>
</div>

<!-- 🌟 Custom Alert Modal -->
<div class="modal fade" id="customAlertModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content" style="border-radius: 16px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
      <div class="modal-body text-center p-4">
        <div id="customAlertIcon" class="mb-3 fs-1"></div>
        <h5 id="customAlertTitle" class="fw-bold mb-2"></h5>
        <p id="customAlertMessage" class="text-secondary mb-4" style="font-size: 14.5px; white-space: pre-line; line-height: 1.5;"></p>
        <button type="button" class="btn w-100 fw-bold rounded-pill" id="customAlertBtn" data-bs-dismiss="modal">OK</button>
      </div>
    </div>
  </div>
</div>

<script>
  const sb = window.supabaseClient;

  // ฟังก์ชันแสดง Custom Alert 
  function showCustomAlert(message, type = 'info', onHideCallback = null) {
    const iconEl = document.getElementById('customAlertIcon');
    const titleEl = document.getElementById('customAlertTitle');
    const msgEl = document.getElementById('customAlertMessage');
    const btnEl = document.getElementById('customAlertBtn');

    msgEl.innerText = message;

    if (type === 'error') {
      iconEl.innerHTML = '<i class="fa-solid fa-circle-xmark text-danger"></i>';
      titleEl.innerText = 'Error';
      titleEl.className = 'fw-bold mb-2 text-danger';
      btnEl.className = 'btn btn-danger w-100 fw-bold rounded-pill';
    } else if (type === 'success') {
      iconEl.innerHTML = '<i class="fa-solid fa-circle-check text-success"></i>';
      titleEl.innerText = 'Success';
      titleEl.className = 'fw-bold mb-2 text-success';
      btnEl.className = 'btn btn-success w-100 fw-bold rounded-pill';
    } else if (type === 'warning') {
      iconEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-warning"></i>';
      titleEl.innerText = 'Warning';
      titleEl.className = 'fw-bold mb-2 text-warning';
      btnEl.className = 'btn btn-warning w-100 fw-bold rounded-pill text-dark';
    } else {
      iconEl.innerHTML = '<i class="fa-solid fa-circle-info text-primary"></i>';
      titleEl.innerText = 'Information';
      titleEl.className = 'fw-bold mb-2 text-primary';
      btnEl.className = 'btn btn-primary w-100 fw-bold rounded-pill';
    }

    const modalEl = document.getElementById('customAlertModal');
    const alertModal = new bootstrap.Modal(modalEl);
    
    if (onHideCallback) {
      modalEl.addEventListener('hidden.bs.modal', function handler() {
        onHideCallback();
        modalEl.removeEventListener('hidden.bs.modal', handler);
      });
    }
    
    alertModal.show();
  }

  window.onload = () => {
    if (window.location.hash.includes("type=recovery")) {
      toggleView('reset');
    } else {
      if(sb) {
        sb.auth.getSession().then(({ data }) => {
          if (data && data.session) window.location.href = 'index.html';
        });
      }
    }
  };

  function toggleView(view) {
    document.getElementById('loginForm').classList.add('d-none');
    document.getElementById('forgotForm').classList.add('d-none');
    document.getElementById('resetForm').classList.add('d-none');

    const title = document.getElementById('mainTitle');
    const subtitle = document.getElementById('subTitle');
    const icon = document.getElementById('brandIcon');

    if (view === 'login') {
      document.getElementById('loginForm').classList.remove('d-none');
      title.innerText = "LINE QR Connect"; subtitle.innerText = "Please log in with your company email";
      icon.innerHTML = '<i class="fa-brands fa-line fs-1"></i>'; icon.style.background = "#06C755";
    } else if (view === 'forgot') {
      document.getElementById('forgotForm').classList.remove('d-none');
      title.innerText = "Forgot Password"; subtitle.innerText = "Request a password reset link";
      icon.innerHTML = '<i class="fa-solid fa-envelope-open-text fs-2"></i>'; icon.style.background = "#f59e0b";
      
      const currentEmail = document.getElementById('loginEmail').value.trim();
      if(currentEmail) {
        document.getElementById('forgotEmail').value = currentEmail;
      }
    } else if (view === 'reset') {
      document.getElementById('resetForm').classList.remove('d-none');
      title.innerText = "Reset Password"; subtitle.innerText = "Create your new secure password";
      icon.innerHTML = '<i class="fa-solid fa-shield-halved fs-2"></i>'; icon.style.background = "#10b981";
    }
  }

  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('btnLoginBtn');
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value.trim();

    if (!email || !password) {
      showCustomAlert("Please enter both Email and Password.", "warning");
      return;
    }

    if (!sb) {
      showCustomAlert("Supabase configuration not found.", "error");
      return;
    }

    btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Logging in...';

    const { data, error } = await sb.auth.signInWithPassword({ email, password });

    if (error) {
      showCustomAlert("Invalid email or password.", "error");
      btn.disabled = false; btn.innerHTML = 'Log In';
    } else {
      window.location.href = 'index.html';
    }
  }

  async function handleForgotPassword(e) {
    e.preventDefault();
    const btn = document.getElementById('btnForgotBtn');
    const email = document.getElementById('forgotEmail').value.trim();

    btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Sending...';

    const { data, error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + window.location.pathname
    });

    if (error) {
      showCustomAlert("Error: " + error.message, "error");
    } else {
      showCustomAlert("Password reset link sent!\nPlease check your inbox.", "success", () => {
        toggleView('login');
      });
    }
    btn.disabled = false; btn.innerHTML = 'Send Reset Link';
  }

  async function handleResetPassword(e) {
    e.preventDefault();
    const btn = document.getElementById('btnResetBtn');
    const newPassword = document.getElementById('newPassword').value.trim();

    btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Saving...';

    const { data, error } = await sb.auth.updateUser({ password: newPassword });

    if (error) {
      showCustomAlert("Failed to reset password:\n" + error.message, "error");
      btn.disabled = false; btn.innerHTML = 'Save New Password';
    } else {
      showCustomAlert("Password reset successfully!\nLogging you in...", "success", () => {
        window.location.href = 'index.html';
      });
    }
  }
</script>
</body>
</html>
